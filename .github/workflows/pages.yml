name: Deploy submission form (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "submit/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage Pages site
        run: |
          mkdir -p _site/submit
          cp -a submit/. _site/submit/
          # Convenience redirect at site root
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=./submit/" />
          <title>Retro Catalog</title>
          <p><a href="./submit/">Catalog title submission form</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
